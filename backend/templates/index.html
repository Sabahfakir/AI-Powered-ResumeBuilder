<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Resume Builder</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">


<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark gradient-navbar px-4">
    <a class="navbar-brand fw-bold" href="index.html">
        <i class="fa-solid fa-file"></i> AI Resume Builder
    </a>

    <div class="ms-auto">
        <a href="ats" class="btn btn-light btn-sm">
            <i class="fa fa-chart-line"></i> ATS Checker
        </a>
    </div>
</nav>

<div class="container-fluid mt-4">
<div class="row g-4">

<!-- LEFT PANEL -->
<div class="col-lg-5">
<div class="glass-card p-4 form-panel">

<h4 class="mb-4 fw-bold text-center">Build Your Resume</h4>

<div class="mb-3">
<label class="form-label"><i class="fa fa-user"></i> Full Name</label>
<input type="text" id="name" class="form-control">
</div>

<div class="mb-3">
<label class="form-label"><i class="fa fa-envelope"></i> Email</label>
<input type="email" id="email" class="form-control">
</div>

<div class="mb-3">
<label class="form-label"><i class="fa fa-phone"></i> Phone</label>
<input type="text" id="phone" class="form-control">
</div>

<div class="mb-3">
<label class="form-label"><i class="fa fa-star"></i> Skills</label>
<textarea id="skills" class="form-control" rows="2"></textarea>
</div>

<div class="mb-3">
<label class="form-label"><i class="fa fa-briefcase"></i> Experience</label>
<textarea id="experience" class="form-control" rows="3"></textarea>
</div>

<div class="mb-3">
<label class="form-label"><i class="fa fa-graduation-cap"></i> Education</label>
<textarea id="education" class="form-control" rows="2"></textarea>
</div>

<button class="btn btn-gradient w-100 mb-3" onclick="generateSummary()">
    <i class="fa fa-robot"></i> Generate AI Summary
</button>

<textarea id="summary" class="form-control mb-3" rows="3" placeholder="Professional Summary"></textarea>

<button class="btn btn-warning w-100 mb-3" onclick="checkATS()">
    <i class="fa fa-chart-line"></i> Check ATS Score
</button>

<div class="progress mb-3">
    <div id="atsBar" class="progress-bar" role="progressbar" style="width:0%">0%</div>
</div>

<button class="btn btn-success w-100" onclick="downloadPDF()">
    <i class="fa fa-download"></i> Download PDF
</button>

</div>
</div>

<!-- RIGHT PANEL (STICKY PREVIEW) -->
<div class="col-lg-7">
<div class="resume-preview shadow-lg p-5" id="resumePreview">

<h2 id="previewName">Your Name</h2>
<p id="previewContact" class="text-muted">Email | Phone</p>
<hr>

<h5>Professional Summary</h5>
<p id="previewSummary"></p>

<h5>Skills</h5>
<p id="previewSkills"></p>

<h5>Experience</h5>
<p id="previewExperience"></p>

<h5>Education</h5>
<p id="previewEducation"></p>

</div>
</div>

</div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
