<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATS Score Checker</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark gradient-navbar px-4">
    <a class="navbar-brand fw-bold" href="index.html">
        <i class="fa-solid fa-file"></i> AI Resume Builder
    </a>
</nav>

<div class="container mt-5">

<div class="glass-card p-5 text-center">

<h3 class="mb-4">Upload Resume for ATS Score</h3>

<input type="file" id="resumeFile" class="form-control mb-3">

<textarea id="jobDescription" class="form-control mb-3" rows="4"
placeholder="Paste Job Description Here"></textarea>

<button class="btn btn-gradient w-100 mb-4" onclick="uploadResume()">
    <i class="fa fa-search"></i> Analyze Resume
</button>

<div class="progress mb-3">
    <div id="atsBar" class="progress-bar bg-success" style="width:0%">0%</div>
</div>

<div id="analysisResult" class="text-start"></div>

</div>

</div>

<script src="{{ url_for('static', filename='ats.js') }}"></script>
</body>
</html>
